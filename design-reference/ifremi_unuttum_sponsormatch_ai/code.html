</div>
<!-- Typography Header -->
<div class="text-center mb-8">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Şifremi Unuttum</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Şifrenizi sıfırlamak için kayıtlı e-posta adresinizi girin.
                </p>
</div>
<!-- Form -->
<form class="space-y-6" id="forgotPasswordForm">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="email">E-posta Adresi</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim transition-all" id="email" name="email" placeholder="ornek@alanadi.com" required="" type="email">
</div>
</div>
<button class="w-full bg-primary-container text-on-primary py-4 rounded-lg font-label-md text-label-md font-semibold hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-2" type="submit">
                    Şifre Sıfırlama Bağlantısı Gönder
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Navigation Back -->
<div class="mt-10 text-center border-t border-outline-variant pt-8">
<a class="inline-flex items-center gap-1 font-label-md text-label-md text-secondary hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">chevron_left</span>

<a class="font-label-md text-label-md text-on-secondary-container hover:text-primary transition-all" href="#">İletişim</a>
</div>

<script>
        // Simple Interaction logic
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            
            // Show Loading State
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin material-symbols-outlined">progress_activity</span> İşleniyor...`;
            
            // Simulate API Call
            setTimeout(() => {
                btn.classList.replace('bg-primary-container', 'bg-green-600');
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Bağlantı Gönderildi!`;
                
                // Add a subtle success message
                const successMsg = document.createElement('p');
                successMsg.className = 'text-green-600 text-center mt-4 font-label-sm text-label-sm animate-fade-in';
                successMsg.innerText = 'E-posta kutunuzu kontrol edin. Birkaç dakika içinde ulaşmazsa spam klasörüne bakın.';
                e.target.appendChild(successMsg);
            }, 1500);
        });
    </script>
