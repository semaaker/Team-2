<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SponsorMatch AI - Yeni Hesap Oluştur</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#f9f9f9",
                        "on-tertiary-fixed-variant": "#38485d",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e8e8e8",
                        "surface-container": "#eeeeee",
                        "on-primary-fixed": "#001c3a",
                        "surface-tint": "#476083",
                        "surface-container-highest": "#e2e2e2",
                        "primary-fixed-dim": "#afc8f0",
                        "tertiary-fixed": "#d3e4fe",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "surface": "#f9f9f9",
                        "on-secondary-fixed": "#171c1f",
                        "inverse-surface": "#2f3131",
                        "on-surface-variant": "#43474e",
                        "tertiary-container": "#0e1f33",
                        "secondary-fixed": "#dfe3e7",
                        "error-container": "#ffdad6",
                        "secondary": "#5a5f62",
                        "primary": "#000613",
                        "tertiary": "#000511",
                        "primary-fixed": "#d4e3ff",
                        "surface-dim": "#dadada",
                        "secondary-fixed-dim": "#c3c7cb",
                        "on-tertiary-fixed": "#0b1c30",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c4c6cf",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-background": "#1a1c1c",
                        "primary-container": "#001f3f",
                        "inverse-on-surface": "#f0f1f1",
                        "on-primary-fixed-variant": "#2f486a",
                        "on-surface": "#1a1c1c",
                        "on-primary-container": "#6f88ad",
                        "surface-container-lowest": "#ffffff",
                        "background": "#f9f9f9",
                        "on-secondary-container": "#5e6367",
                        "secondary-container": "#dce0e4",
                        "surface-variant": "#e2e2e2",
                        "outline": "#74777f",
                        "on-secondary-fixed-variant": "#43474b",
                        "inverse-primary": "#afc8f0",
                        "surface-container-low": "#f3f3f4",
                        "on-tertiary-container": "#77879f",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "base": "8px",
                        "gutter": "24px",
                        "container-max": "1280px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],

                        "body-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],

                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }]

                },
            },
        }

<style>
        .input-glow:focus-within {
            box-shadow: 0 0 0 2px #F0F4F8;
            border-color: theme('colors.primary');
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col justify-center items-center p-margin-mobile md:p-margin-desktop">
<!-- Main Registration Container -->
<main class="w-full max-w-md mx-auto">
<!-- Brand / Logo Area -->
<div class="text-center mb-8">
<h1 class="font-headline-md text-headline-md text-primary mb-2">SponsorMatch AI</h1>
<p class="font-body-md text-body-md text-secondary">Profesyonel sponsorluk ağınıza katılın.</p>
</div>
<!-- Card Container -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 md:p-8 shadow-[0_4px_20px_rgba(0,31,63,0.05)]">
<div class="mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Yeni Hesap Oluştur</h2>
<p class="font-body-md text-body-md text-on-surface-variant">SponsorMatch AI dünyasına katılmak için bilgilerinizi girin.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Ad Soyad Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="fullName">Ad Soyad</label>
<div class="input-glow rounded-lg border border-outline-variant transition-all duration-200 bg-surface-container-lowest flex items-center px-3">
<span class="material-symbols-outlined text-outline mr-2" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full bg-transparent border-none py-3 focus:ring-0 text-on-surface placeholder-outline font-body-md text-body-md" id="fullName" name="fullName" placeholder="John Doe" required="" type="text">
</div>
</div>
<!-- Şirket Adı Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="companyName">Şirket Adı</label>
<div class="input-glow rounded-lg border border-outline-variant transition-all duration-200 bg-surface-container-lowest flex items-center px-3">
<span class="material-symbols-outlined text-outline mr-2" style="font-variation-settings: 'FILL' 0;">business</span>
<input class="w-full bg-transparent border-none py-3 focus:ring-0 text-on-surface placeholder-outline font-body-md text-body-md" id="companyName" name="companyName" placeholder="SponsorMatch Inc." required="" type="text">
</div>
</div>
<!-- E-posta Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">E-posta Adresi</label>
<div class="input-glow rounded-lg border border-outline-variant transition-all duration-200 bg-surface-container-lowest flex items-center px-3">
<span class="material-symbols-outlined text-outline mr-2" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-transparent border-none py-3 focus:ring-0 text-on-surface placeholder-outline font-body-md text-body-md" id="email" name="email" placeholder="ornek@sirketiniz.com" required="" type="email">
</div>
</div>
<!-- Şifre Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">Şifre</label>
<div class="input-glow rounded-lg border border-outline-variant transition-all duration-200 bg-surface-container-lowest flex items-center px-3">
<span class="material-symbols-outlined text-outline mr-2" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-transparent border-none py-3 focus:ring-0 text-on-surface placeholder-outline font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 px-4 rounded-lg hover:bg-primary-container transition-colors duration-200 flex justify-center items-center" type="submit">
                    Hesap Oluştur
                </button>
</form>
<!-- Footer Link -->
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Zaten bir hesabın var mı? 
                    <a class="text-primary hover:underline font-label-md text-label-md ml-1" href="#">Giriş Yap</a>
</p>
</div>
</div>
</main>
</body></html>
