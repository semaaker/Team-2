<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('addEventForm');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const submitText = document.getElementById('submitText');
        const submitSpinner = document.getElementById('submitSpinner');
        const toastContainer = document.getElementById('toastContainer');
        const modalOverlay = document.getElementById('modalOverlay');

        const closeModal = () => {
            form.reset();
            modalOverlay.classList.add('hidden');
        };

        cancelBtn.addEventListener('click', closeModal);
        closeModalBtn.addEventListener('click', closeModal);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Gather form data
            const eventName = document.getElementById('eventName').value;
            const eventDate = document.getElementById('eventDate').value;
            const eventCategory = document.getElementById('eventCategory').value;
            const participantCount = document.getElementById('participantCount').value;
            const eventDescription = document.getElementById('eventDescription').value;
            
            const sponsorPackages = Array.from(document.querySelectorAll('input[name="sponsorPackage"]:checked'))
                .map(cb => cb.value);

            const formData = {
                eventName,
                eventDate,
                eventCategory,
                participantCount,
                eventDescription,
                sponsorPackages
            };

            // Show loading state
            submitBtn.disabled = true;
            submitText.textContent = 'Gönderiliyor...';
            submitSpinner.classList.remove('hidden');

            try {
                const response = await fetch('https://sponsormatch.app.n8n.cloud/webhook-test/e138127b-3b8c-42da-9f48-fde985ad317e', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                showToast('Etkinlik başarıyla oluşturuldu!', 'success');
                
                // Optional: Reset and close modal after success
                setTimeout(() => {
                    closeModal();
                    // Reset button state
                    submitBtn.disabled = false;
                    submitText.textContent = 'Etkinlik Oluştur';
                    submitSpinner.classList.add('hidden');
                }, 1000);

            } catch (error) {
                console.error('Error submitting form:', error);
                showToast('Etkinlik oluşturulurken bir hata oluştu.', 'error');
                
                // Reset button state on error
                submitBtn.disabled = false;
                submitText.textContent = 'Etkinlik Oluştur';
                submitSpinner.classList.add('hidden');
            }
        });

        function showToast(message, type) {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-[#2e7d32]' : 'bg-error'; // Green for success, red for error
            toast.className = `px-6 py-4 rounded-lg shadow-lg text-white font-label-md transition-all duration-300 transform translate-y-0 opacity-100 ${bgColor}`;
            toast.textContent = message;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    });
</script>
